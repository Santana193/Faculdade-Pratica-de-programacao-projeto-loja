<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lojinha</title>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/bootstrap.css">
  
<link rel="stylesheet" href="css/style.css">

<script src = "js/funcoes.js"></script>

</head>
<body>
    <div class="container">
    <h1><i id="carrinho"class="bi bi-cart-check"></i>Lojinha da unidade</h1>

    <table class="table table-hover">

        <thead>
            <tr>
                <th>Imagem</th>
                <th>Produto</th>
                <th>Preço Unitario</th>
                <th>Qtd</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <img src="img/produto_1.webp" alt="produto_1" width="200">
                </td>
                <td>
                    <div>Celular Iphone 13</div>
                    <div><span class="produto-item">Código:</span> 1215436</div>
                    <div><span class="produto-item">Cor:</span> branco</div>

                </td>
                <td id="valor_1">R$ 5.000</td>
                <td>
                    <span class="badge text-bg-danger" onclick="alterarQtd (1, '-')"><i class="bi bi-dash"></i></span>
                    <span id="qtd_1">0</span>
                    <span class="badge text-bg-success" onclick="alterarQtd (1, '+')"><i class="bi bi-plus"></i></span>
                </td>
                <td id="total_1">0</td>
            </tr>
            <tr>
                <td>
                    <img src="img/produto_2.webp" alt="produto_2" width="150">
                </td>
                <td>
                    <div>Computador TOP</div>
                    <div><span class="produto-item">Código:</span> 789554</div>
                    <div><span class="produto-item">Cor:</span> preto</div>

                </td>
                <td id="valor_2">R$ 7.000</td>
                <td>
                    <span class="badge text-bg-danger"onclick="alterarQtd(2, '-')"><i class="bi bi-dash"></i></span>
                    <span id="qtd_2">0</span>
                    <span class="badge text-bg-success" onclick="alterarQtd(2, '+')"><i class="bi bi-plus"></i></span>
                </td>
                <td id="total_2">0</td>
            </tr>
            <tr>
                <td>
                    <img src="img/produto_3.webp" alt="produto_3" width="200">
                </td>
                <td>
                    <div>Televisão 60''</div>
                    <div><span class="produto-item">Código:</span> 45678</div>
                    <div><span class="produto-item">Cor:</span> cinza</div>

                </td>
                <td id="valor_3">R$ 8.000</td>
                <td>
                    <span class="badge text-bg-danger"onclick="alterarQtd(3, '-')"><i class="bi bi-dash"></i></span>
                    <span id="qtd_3">0</span>
                    <span class="badge text-bg-success" onclick="alterarQtd(3, '+')"><i class="bi bi-plus"></i></span>
                </td>
                <td id="total_3">0</td>
            </tr>
          

        </tbody>
    </table>
    <footer class="text-center">
        <span><i class="bi bi-cart"></i>Subtotal: <span id="subtotal">R$: 0</span></span>
    </footer>
</div>
</body>
</html>
